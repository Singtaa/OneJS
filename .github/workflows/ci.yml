name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.md.meta'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.md.meta'
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.5.2f1
  PROJECT_PATH: CIProject

jobs:
  unity-tests:
    name: Unity tests (EditMode + PlayMode)
    runs-on: ubuntu-latest
    environment: unity-ci

    steps:
      - uses: actions/checkout@v4
        with:
          # The QuickJS engine sources are submodules under Auxiliary~.
          submodules: recursive

      # The repo ships a prebuilt Linux .so (produced in this same ubuntu:22.04
      # container: see Plugins/README.md). CI still rebuilds it from the
      # vendored QuickJS source each run, overwriting the committed binary for
      # the test run, so the build script and source stay continuously verified.
      - name: Build Linux QuickJS native library
        run: |
          # Built inside ubuntu:22.04 so the .so links against a glibc no newer
          # than the unityci test container's (the runner's 24.04 glibc is not
          # available in there). This is also the pinned baseline for the
          # committed binary (glibc 2.35, Unity 6's own Ubuntu 22.04 floor).
          docker run --rm -v "$PWD":/repo -w /repo ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq gcc make > /dev/null && bash Auxiliary~/quickjs-unity/build-linux.sh"

      # OneJS is a package, so CI hosts it inside a throwaway project. The host's
      # dependencies are read out of the package manifest rather than listed again
      # here. UPM does not resolve them itself in this layout (the package is copied
      # into Assets/, not Packages/), and a second hand-maintained list would drift
      # from the first until something the runtime uses is missing from one of them.
      # Reading package.json makes this job the check on that declaration: a module
      # the code needs and the package does not declare fails the build here.
      - name: Bootstrap host project
        run: |
          mkdir -p "$PROJECT_PATH/Assets" "$PROJECT_PATH/Packages" "$PROJECT_PATH/ProjectSettings"
          # Extras exist only for the tests: the test framework itself, and the
          # Input System, without which OneJS.Runtime.InputSystem is constrained
          # out and its 64-method surface is never compiled here at all.
          jq '{dependencies: (.dependencies + {
                 "com.unity.test-framework": "1.7.0",
                 "com.unity.inputsystem": "1.19.0"
               })}' package.json > "$PROJECT_PATH/Packages/manifest.json"
          cat "$PROJECT_PATH/Packages/manifest.json"
          echo "m_EditorVersion: $UNITY_VERSION" > "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          rsync -a --exclude=.git --exclude=.github --exclude="$PROJECT_PATH" ./ "$PROJECT_PATH/Assets/OneJS"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ env.UNITY_VERSION }}-${{ github.sha }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

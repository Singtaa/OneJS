name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.md.meta'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.md.meta'
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.5.2f1
  PROJECT_PATH: CIProject

jobs:
  unity-tests:
    name: Unity tests (EditMode + PlayMode)
    runs-on: ubuntu-latest
    environment: unity-ci

    steps:
      - uses: actions/checkout@v4
        with:
          # The QuickJS engine sources are submodules under Auxiliary~.
          submodules: recursive

      # The repo ships no Linux native library, only a parked .meta reserving
      # the GUID. Build it from the vendored QuickJS source (the script installs
      # straight into Plugins/Linux/x64), then activate the parked meta.
      - name: Build Linux QuickJS native library
        run: |
          # Built inside ubuntu:22.04 so the .so links against a glibc no newer
          # than the unityci test container's (the runner's 24.04 glibc is not
          # available in there).
          docker run --rm -v "$PWD":/repo -w /repo ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq gcc make > /dev/null && bash Auxiliary~/quickjs-unity/build-linux.sh"
          mv Plugins/Linux/x64/libquickjs_unity.so.meta.txt Plugins/Linux/x64/libquickjs_unity.so.meta
          rm -f Plugins/Linux/x64/libquickjs_unity.so.meta.txt.meta

      # OneJS is a package, so CI hosts it inside a throwaway project. The
      # package has no Unity package dependencies; the manifest below is just
      # the test framework plus the built-in modules the runtime touches.
      # (Vector Graphics is a built-in module as of Unity 6.3.)
      - name: Bootstrap host project
        run: |
          mkdir -p "$PROJECT_PATH/Assets" "$PROJECT_PATH/Packages" "$PROJECT_PATH/ProjectSettings"
          cat > "$PROJECT_PATH/Packages/manifest.json" <<'JSON'
          {
            "dependencies": {
              "com.unity.test-framework": "1.7.0",
              "com.unity.inputsystem": "1.19.0",
              "com.unity.ugui": "2.5.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequesttexture": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.vectorgraphics": "1.0.0"
            }
          }
          JSON
          echo "m_EditorVersion: $UNITY_VERSION" > "$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
          rsync -a --exclude=.git --exclude=.github --exclude="$PROJECT_PATH" ./ "$PROJECT_PATH/Assets/OneJS"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ env.UNITY_VERSION }}-${{ github.sha }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
